 if(stage==='投产'){if(S.productionProfile)h('p','项目生产配置：'+(typeof S.productionProfile==='string'?S.productionProfile:JSON.stringify(S.productionProfile)),p);for(const j of S.jobs){const k=detail(p,j.id+' · '+j.status+' · '+(j.entry||'历史运行预览')+(j.sourceState?' · '+j.sourceState:''),j.prompt);h('pre',JSON.stringify(j.refs,null,2),k);for(const ref of j.refs||[]){if(ref.mediaId)button(k,'预览 '+(ref.slot||ref.role||'')+' '+asset(ref.mediaId)?.name,()=>choose(ref.mediaId))}h('pre',JSON.stringify(j.params||j.fields?.filter(f=>!['text','image','audio','video'].includes(f.type))||{},null,2),k);h('p','输出：'+(j.outputs||[]).join('；'),k);if(j.runs?.length)h('pre',JSON.stringify(j.runs,null,2),k)}sectionCards(p,doc('视频提示词.md'));showDoc(p,'视频提示词.md')}
 if(stage==='投产'&&!S.jobs.length)h('p','未登记真实运行；提示词草案不代表已经提交。',p);
 if(stage==='回片'||stage==='交付'){tiles(p,S.media.filter(x=>x.stage===stage));for(const a of S.media.filter(x=>x.stage===stage)){const flags=['seen','heard'].filter(k=>d[k+':'+a.id]).map(k=>k==='seen'?'已看':'已听');if(flags.length)h('p',a.name+' · '+flags.join(' / '),p)}notes(p)}
 if(stage==='剪辑'){for(const c of S.clips){let a=S.media.find(x=>x.path===c.media);let label=c.start.toFixed(2)+'–'+(c.end?.toFixed(2)??'?')+'s · '+c.id+' · '+c.src;if(a)button(p,label,()=>choose(a.id,c.offset));else h('p',label,p)}}

$('register').onclick=async()=>{const path=prompt('本机项目目录（也可选择云盘已同步的本地目录）');if(!path)return;try{const v=await call('register',{path});location.href='/api/plugins/short-drama/projects/'+v.id+'/desk'}catch(e){msg(e.message)}};
$('episodes').onchange=async e=>{ep=e.target.value;picked=compare=focus='';clearTimeout(slide);await load()};let events=[],seq=0,es,refreshTimer,pendingRefresh=false,userEditing=false;
 function showHistory(){const panel=$('events');panel.replaceChildren();const list=events.filter(e=>$('allEpisodes').checked||!e.episode||e.episode===ep);for(const e of list.slice(-100).reverse()){const a=detail(panel,new Date(e.at).toLocaleTimeString()+' · '+(e.episode||'项目')+' · '+e.stage+' · '+e.change+' · '+(e.path||e.actor||''));if(e.type==='report'){h('p',e.message,a);for(const path of e.paths||[])h('small',path+' ',a)}if(e.diff)h('pre','第 '+e.diff.line+' 行附近 · −'+e.diff.minus+' / +'+e.diff.plus+'\\n− '+e.diff.removed+'\\n+ '+e.diff.added,a);else if(e.type==='file')h('small','文件变更 · '+e.bytes+' 字节',a);if(S.stages[e.stage])button(a,'看当前产物',async()=>{if(e.episode&&e.episode!==ep)ep=e.episode;await load();navigate(e.stage);const a=S.media.find(x=>x.path===e.path||(e.paths||[]).some(path=>x.path===path||x.path.endsWith('/'+path)));if(a)choose(a.id);else if(e.path){const name=e.path.split('/').at(-1),summary=[...document.querySelectorAll('main summary')].find(z=>z.textContent.startsWith(name));if(summary){summary.parentNode.open=true;summary.scrollIntoView({block:'nearest'})}}})}if(!list.length)h('p','已读取当前产物；从开始监测起记录新增与调整。',panel)}
 function receive(e){if(e.seq<=seq)return;seq=e.seq;events.push(e);events=events.slice(-400);showHistory();$('liveTitle').textContent='实时监测中 · '+new Date(e.at).toLocaleTimeString()+' · '+e.change+' '+(e.path||e.stage);if(!e.episode||e.episode===ep){pendingRefresh=true;clearTimeout(refreshTimer);refreshTimer=setTimeout(()=>{if(!userEditing&&!picked&&!slide&&!document.querySelector('main details[open]')){pendingRefresh=false;load().catch(x=>msg(x.message))}else msg('项目有新产物。播放或草稿已保留，可点「刷新产物」查看。')},400)}}
 async function start(){await load();const projects=await call('projects');const current=api.split('/').at(-2);for(const v of projects){const o=h('option',v.name,$('projects'));o.value=v.id;o.title=v.path;o.selected=v.id===current}
 $('projects').onchange=e=>{location.href='/api/plugins/short-drama/projects/'+encodeURIComponent(e.target.value)+'/desk'};const log=await call('history');events=log.events;seq=log.seq;draw();showHistory();es=new EventSource(url('events')+'&since='+seq);es.onopen=()=>{$('liveTitle').textContent='实时监测中 · 项目动态 ('+events.length+')'};es.onmessage=m=>receive(JSON.parse(m.data));es.onerror=()=>{$('liveTitle').textContent='监测连接重连中 · 已有记录保留'};}
 $('allEpisodes').onchange=showHistory;document.addEventListener('input',e=>{if(e.target.matches('textarea,input:not([type=range]):not([type=checkbox])'))userEditing=true});$('refresh').onclick=()=>{if(userEditing&&!confirm('刷新会放弃尚未保存的输入，继续？'))return;userEditing=false;load().catch(e=>msg(e.message))};window.addEventListener('pagehide',()=>es?.close());
 start().catch(e=>msg(e.message));$('timeline').onclick=async()=>{try{const {id}=await call('timeline',{});location.href='/projects/'+encodeURIComponent(id)}catch(e){msg(e.message)}};
